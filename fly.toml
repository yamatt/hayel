# fly.toml app configuration file generated for hayel-mc on 2026-08-21T12:24:18+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hayel-mc'
primary_region = 'lhr'

[build]
[[mounts]]
  source = 'repositories'
  destination = '/repositories'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
