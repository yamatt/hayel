name: Test

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test.yml"
      - "Dockerfile"
      - ".dockerignore"
      - ".hadolint.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test.yml"
      - "Dockerfile"
      - ".dockerignore"
      - ".hadolint.yaml"

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go fmt
        run: |
          go fmt ./...
      - name: Run go vet
        run: |
          go vet ./...
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check Docker files with Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          format: tty
  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - go-lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -v -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.txt
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
