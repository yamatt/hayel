name: Test

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test.yml"
      - "Dockerfile"
      - ".dockerignore"
      - ".hadolint.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test.yml"
      - "Dockerfile"
      - ".dockerignore"
      - ".hadolint.yaml"

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go fmt
        run: |
          go fmt ./...
      - name: Run go vet
        run: |
          go vet ./...
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Docker files with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: tty
  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - go-lint
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -v -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.txt
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
