name: Test

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go fmt
        run: |
          go fmt ./...
      - name: Run go vet
        run: |
          go vet ./...
  dockerfile-lint:
    name: Run Hadolint on Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Docker files with Hadolint
        uses: essentialkaos/hadolint-action@2ab1ea0c7dfc4674d5b4ee13eb8d6e64931652e8 # v1
        with:
          files: Dockerfile
          format: tty
          strict-labels: true
          failure-threshold: warning
  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -race -cover ./...
